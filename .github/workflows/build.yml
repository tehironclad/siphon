name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:      # lets you build installers on demand from the Actions tab

permissions:
  contents: write         # needed to publish Releases

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: Siphon-windows
          - os: macos-latest
            asset: Siphon-macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Siphon + build deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[build,desktop]"

      - name: Build self-contained app (bundles ffmpeg + Node + POT server)
        run: python build.py

      - name: Package
        shell: bash
        run: |
          cd dist
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a "../${{ matrix.asset }}.zip" .
          else
            zip -r "../${{ matrix.asset }}.zip" .
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}.zip

      - name: Publish to Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset }}.zip
