[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "siphon-dl"
version = "0.1.0"
description = "Grab any video in real 4K — a tiny, focused downloader."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "tehironclad" }]
keywords = ["youtube", "downloader", "4k", "yt-dlp", "video"]
dependencies = [
    "yt-dlp>=2024.1",
    # Unlocks YouTube's SABR-gated HD/4K streams. Node token server is built
    # once via `python -m siphon.setup_pot`.
    "bgutil-ytdlp-pot-provider>=1.3,<2",
    "fastapi>=0.100",
    "uvicorn[standard]>=0.23",
    "pydantic>=2.0",
]

[project.optional-dependencies]
desktop = ["pywebview>=5.0"]   # native app window; browser fallback otherwise
build = ["pyinstaller>=6.0"]

[project.scripts]
siphon = "siphon.__main__:main"

[project.urls]
Homepage = "https://github.com/tehironclad/siphon"

[tool.setuptools.packages.find]
include = ["siphon*"]

[tool.setuptools.package-data]
siphon = ["static/*.html"]
